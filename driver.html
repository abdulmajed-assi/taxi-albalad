<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كابتن تكسي البلد | Taxi Al Balad Captain</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --brand-yellow: #fcba03;
            --brand-yellow-glow: rgba(252, 186, 3, 0.35);
            --brand-black: #0d0d0d;
            --brand-card: #1f1f1f;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--brand-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .driver-container { width: 100%; max-width: 440px; }

        .driver-card {
            background: linear-gradient(160deg, #222222 0%, #141414 100%);
            border: 2px solid var(--brand-yellow);
            border-radius: 28px;
            padding: 2.2rem 1.6rem;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(252, 186, 3, 0.15);
            position: relative;
            overflow: hidden;
        }

        .driver-card::before {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: repeating-linear-gradient(90deg, var(--brand-yellow), var(--brand-yellow) 15px, #000 15px, #000 30px);
        }

        .app-logo {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 3px solid var(--brand-yellow);
            margin: 0.5rem auto 1.2rem;
            display: block; background: #fff;
            object-fit: cover;
            box-shadow: 0 6px 25px var(--brand-yellow-glow);
        }

        .brand-heading h1 { font-size: 1.5rem; font-weight: 900; color: var(--brand-yellow); line-height: 1.2; }
        .brand-heading p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.6rem; font-weight: 600; }

        .form-group { text-align: right; margin-bottom: 1rem; }
        .form-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; display: block; }
        
        .phone-input-row {
            display: flex;
            align-items: stretch;
            direction: ltr !important;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            transition: border-color 0.2s;
        }
        .phone-input-row:focus-within {
            border-color: var(--brand-yellow);
        }
        .phone-input-row .prefix-tag {
            background: #eef2f6;
            color: #0b132b;
            font-weight: 900;
            font-size: 1.15rem;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #cbd5e1;
            user-select: none;
            letter-spacing: 0.5px;
        }
        .phone-input-row input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #111111;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 12px 14px;
            direction: ltr;
        }

        .input-icon-wrap { position: relative; display: flex; align-items: center; }
        .input-icon-wrap i { position: absolute; right: 14px; color: var(--brand-yellow); font-size: 1rem; }
        
        .form-input-pass {
            width: 100%; padding: 13px 42px 13px 14px;
            border-radius: 12px; border: 2px solid #333;
            background: #111; color: #fff; outline: none;
            font-size: 1rem; font-weight: 700;
        }
        .form-input-pass:focus { border-color: var(--brand-yellow); }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--brand-yellow) 0%, #d49b00 100%);
            color: #000; border: none; padding: 14px; border-radius: 12px;
            font-size: 1.15rem; font-weight: 900; cursor: pointer; margin-top: 0.5rem;
            box-shadow: 0 6px 20px rgba(252, 186, 3, 0.3);
        }

        .driver-info-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(252, 186, 3, 0.2);
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gps-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 7px 16px; border-radius: 20px;
            font-size: 0.82rem; font-weight: 800; margin-bottom: 1.2rem;
        }

        .gps-pulse {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.35); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .credit-card-meter {
            background: linear-gradient(145deg, #111 0%, #080808 100%);
            border-radius: 18px; padding: 1.4rem; margin-bottom: 1.4rem;
            border: 1px solid rgba(252, 186, 3, 0.3);
        }

        .credit-number {
            font-size: 3.5rem; font-weight: 900; color: var(--brand-yellow);
            line-height: 1; margin: 0.3rem 0;
            text-shadow: 0 0 20px var(--brand-yellow-glow);
        }

        .badge { padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; display: inline-block; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-busy { background: rgba(252, 186, 3, 0.2); color: var(--brand-yellow); border: 1px solid var(--brand-yellow); }

        .toggle-status-btn {
            width: 100%; padding: 16px; border-radius: 14px;
            font-size: 1.15rem; font-weight: 900; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-to-break { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #fff; }
        .btn-to-work { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); color: #000; }

        .driver-expired-box {
            background: rgba(239, 68, 68, 0.1); border: 2px dashed var(--accent-red);
            border-radius: 18px; padding: 1.5rem 1.2rem; margin-top: 1rem;
        }
        .driver-expired-box p { color: #ffb4b4; font-size: 0.95rem; font-weight: 700; line-height: 1.5; margin-bottom: 1.2rem; }
        .btn-renew-sub {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #ffffff; text-decoration: none; width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 900; font-size: 1.05rem;
        }

        .btn-logout { background: transparent; border: none; color: var(--text-muted); margin-top: 1.5rem; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
    </style>
</head>
<body>

    <!-- Gömülü Kesintisiz Sessiz Ses Elemanı (CORS Hatası Vermez) -->
    <audio id="bgKeepAliveAudio" loop playsinline>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
    </audio>

    <div class="driver-container">
        <!-- 1. GİRİŞ EKRANI -->
        <div id="driverLoginBox" class="driver-card">
            <img src="logo.jpg" alt="Logo" class="app-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2554/2554978.png'">
            
            <div class="brand-heading">
                <h1>تكسي البلد | كابتن</h1>
                <p>بوابة تسجيل دخول السائقين</p>
            </div>
            
            <form onsubmit="handleDriverLogin(event)">
                <div class="form-group">
                    <label class="form-label">رقم الهاتف</label>
                    <div class="phone-input-row">
                        <span class="prefix-tag">+963</span>
                        <input type="tel" id="driverLocalPhoneInput" placeholder="962750014" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">رمز المرور (PIN)</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="driverPassInput" class="form-input-pass" placeholder="••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> تسجيل الدخول
                </button>
            </form>
        </div>

        <!-- 2. ŞOFÖR KONTROL PANELİ -->
        <div id="driverPanelBox" class="driver-card" style="display:none;">
            <img src="logo.jpg" alt="Logo" class="app-logo" style="width: 75px; height: 75px; margin-bottom: 0.8rem;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2554/2554978.png'">

            <div class="driver-info-badge">
                <div style="text-align: right;">
                    <div id="dName" style="font-size: 1.15rem; font-weight: 900; color: #fff;">-</div>
                    <div style="font-size: 0.8rem; color: var(--brand-yellow); font-weight: 700;">
                        <span id="dCar">-</span> | <i class="fa-solid fa-location-dot"></i> <span id="dCityDisplay">جاري تحديد الموقع...</span>
                    </div>
                </div>
                <div id="dStatusBadge" class="badge badge-active">-</div>
            </div>

            <div class="gps-pill" id="driverGpsBadge">
                <span class="gps-pulse"></span>
                <span id="driverGpsStatus">GPS متصل ويعمل بالخلفية</span>
            </div>

            <div class="credit-card-meter">
                <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">الأيام المتبقية في اشتراكك</div>
                <div class="credit-number" id="dDays">0</div>
                <div id="dExpiryDate" style="color:var(--text-muted); font-size:0.8rem; margin-top:4px; font-weight:700;">ينتهي في: --</div>
            </div>

            <button class="toggle-status-btn btn-to-break" id="driverToggleOnlineBtn" onclick="toggleOnline()">
                <i class="fa-solid fa-pause"></i> <span>أخذ استراحة (إيقاف الاستقبال)</span>
            </button>

            <div id="driverExpiredBox" class="driver-expired-box" style="display:none;">
                <p>
                    <i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red); margin-left:4px;"></i>
                    انتهت أيام اشتراكك في النظام!<br>يرجى التواصل مع إدارة <b>تكسي البلد</b> لتجديد الاشتراك ومتابعة العمل.
                </p>
                <a id="driverRenewWhatsAppBtn" href="#" class="btn-renew-sub">
                    <i class="fa-brands fa-whatsapp"></i> تواصل مع الإدارة لتجديد الاشتراك
                </a>
            </div>

            <div>
                <button onclick="logoutDriver()" class="btn-logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const driversRef = db.ref('drivers');

        const CENTRAL_ADMIN_PHONE = "963962750014";
        let activeDriver = null;
        let driversList = [];
        let gpsWatchId = null;
        let gpsHeartbeatInterval = null;
        let wakeLockInstance = null;

        const savedPhone = localStorage.getItem('taxi_driver_phone');

        function cleanSyrianPhone(raw) {
            let d = raw.toString().replace(/[^0-9]/g, '');
            if (d.startsWith('00963')) d = d.substring(2);
            if (d.startsWith('9630')) d = '963' + d.substring(4);
            else if (d.startsWith('0')) d = '963' + d.substring(1);
            else if (!d.startsWith('963')) d = '963' + d;
            return d;
        }

        const syrianCities = [
            { name: 'دمشق', lat: 33.5138, lng: 36.2765 },
            { name: 'ريف دمشق', lat: 33.5400, lng: 36.3800 },
            { name: 'حمص', lat: 34.7324, lng: 36.7137 },
            { name: 'حلب', lat: 36.2021, lng: 37.1343 },
            { name: 'حماة', lat: 35.1318, lng: 36.7578 },
            { name: 'اللاذقية', lat: 35.5317, lng: 35.7900 },
            { name: 'طرطوس', lat: 34.8890, lng: 35.8866 },
            { name: 'درعا', lat: 32.6255, lng: 36.1055 },
            { name: 'السويداء', lat: 32.7090, lng: 36.5695 },
            { name: 'القنيطرة', lat: 33.1250, lng: 35.8200 },
            { name: 'دير الزور', lat: 35.3350, lng: 40.1450 },
            { name: 'الرقة', lat: 35.9500, lng: 39.0100 },
            { name: 'الحسكة', lat: 36.5000, lng: 40.7500 },
            { name: 'إدلب', lat: 35.9306, lng: 36.6339 }
        ];

        function getClosestCity(lat, lng) {
            let closestCity = 'دمشق';
            let minDistance = Infinity;

            syrianCities.forEach(city => {
                const dist = Math.hypot(city.lat - lat, city.lng - lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestCity = city.name;
                }
            });
            return closestCity;
        }

        // ANDROID ÜST BİLDİRİM VE ARKA PLAN KİLİDİ
        async function setupMediaSession() {
            // 1. Ekran Kilidini Açık Tut
            try {
                if ('wakeLock' in navigator && !wakeLockInstance) {
                    wakeLockInstance = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}

            // 2. Bildirim Çubuğu Medya Kartı
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '🚖 كابتن تكسي البلد (أونلاين)',
                    artist: activeDriver ? `الكابتن: ${activeDriver.name}` : 'جاري العمل واستقبال المشاوير',
                    album: 'خدمة التتبع المباشر تعمل في الخلفية',
                    artwork: [
                        { src: 'logo.jpg', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.playbackState = "playing";
                navigator.mediaSession.setActionHandler('play', () => startGpsTracking());
                navigator.mediaSession.setActionHandler('pause', () => {});
            }

            // 3. Arka Plan Canlı Tutma Sesi
            const audio = document.getElementById('bgKeepAliveAudio');
            if (audio) {
                audio.play().catch(() => {});
            }
        }

        driversRef.on('value', (snapshot) => {
            const data = snapshot.val();
            driversList = [];
            if(data) {
                Object.keys(data).forEach(key => driversList.push({ ...data[key], fbKey: key }));
            }
            if(activeDriver) {
                const updated = driversList.find(d => cleanSyrianPhone(d.phone) === cleanSyrianPhone(activeDriver.phone));
                if(updated) { activeDriver = updated; renderPanel(); }
            } else if(savedPhone) {
                const found = driversList.find(d => cleanSyrianPhone(d.phone) === cleanSyrianPhone(savedPhone));
                if(found) {
                    activeDriver = found;
                    document.getElementById('driverLoginBox').style.display = 'none';
                    document.getElementById('driverPanelBox').style.display = 'block';
                    renderPanel();
                    startGpsTracking();
                }
            }
        });

        function calculateDays(expiryTimestamp) {
            const diff = expiryTimestamp - Date.now();
            return diff <= 0 ? 0 : Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function handleDriverLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('driverLocalPhoneInput').value;
            const fullPhone = cleanSyrianPhone(rawPhone);
            const pass = document.getElementById('driverPassInput').value.trim();

            const driver = driversList.find(d => cleanSyrianPhone(d.phone) === fullPhone);
            if(!driver) { alert("❌ رقم الهاتف غير مسجل لدى الإدارة!"); return; }
            if(driver.password && driver.password !== pass) { alert("❌ رمز المرور (PIN) غير صحيح!"); return; }

            activeDriver = driver;
            localStorage.setItem('taxi_driver_phone', fullPhone);
            document.getElementById('driverLoginBox').style.display = 'none';
            document.getElementById('driverPanelBox').style.display = 'block';
            renderPanel();
            startGpsTracking();
        }

        function logoutDriver() {
            localStorage.removeItem('taxi_driver_phone');
            if (activeDriver && activeDriver.fbKey) {
                driversRef.child(activeDriver.fbKey).update({ isOnline: false });
            }
            activeDriver = null;
            stopGpsTracking();
            document.getElementById('driverPanelBox').style.display = 'none';
            document.getElementById('driverLoginBox').style.display = 'block';
        }

        function renderPanel() {
            if(!activeDriver) return;
            const daysLeft = calculateDays(activeDriver.expiryTimestamp);
            document.getElementById('dName').innerText = `كابتن ${activeDriver.name}`;
            document.getElementById('dCar').innerText = activeDriver.car;
            document.getElementById('dCityDisplay').innerText = activeDriver.city || 'دمشق';
            document.getElementById('dDays').innerText = daysLeft;
            
            const expDate = new Date(activeDriver.expiryTimestamp);
            document.getElementById('dExpiryDate').innerText = `ينتهي في: ${expDate.getDate()}/${expDate.getMonth()+1}/${expDate.getFullYear()}`;

            const badge = document.getElementById('dStatusBadge');
            const toggleBtn = document.getElementById('driverToggleOnlineBtn');
            const expiredBox = document.getElementById('driverExpiredBox');
            const renewBtn = document.getElementById('driverRenewWhatsAppBtn');

            if(daysLeft <= 0) {
                badge.className = "badge badge-expired";
                badge.innerText = "منتهي الاشتراك";
                toggleBtn.style.display = "none";
                expiredBox.style.display = "block";
                
                const renewMsg = `مرحباً إدارة تكسي البلد، أنا السائق (${activeDriver.name}) ورقمي (${activeDriver.phone}). انتهى اشتراكي وأرغب بتجديد وإضافة أيام جديدة.`;
                renewBtn.href = `https://wa.me/${CENTRAL_ADMIN_PHONE}?text=${encodeURIComponent(renewMsg)}`;
            } else {
                expiredBox.style.display = "none";
                toggleBtn.style.display = "flex";
                if(activeDriver.isOnline) {
                    badge.className = "badge badge-active";
                    badge.innerText = "متاح للعمل (أونلاين)";
                    toggleBtn.className = "toggle-status-btn btn-to-break";
                    toggleBtn.innerHTML = '<i class="fa-solid fa-pause"></i> <span>أخذ استراحة (إيقاف الاستقبال)</span>';
                } else {
                    badge.className = "badge badge-busy";
                    badge.innerText = "في استراحة (أوفلاين)";
                    toggleBtn.className = "toggle-status-btn btn-to-work";
                    toggleBtn.innerHTML = '<i class="fa-solid fa-play"></i> <span>بدء العمل (استقبال المشاوير)</span>';
                }
            }
        }

        function toggleOnline() {
            if(!activeDriver || !activeDriver.fbKey) return;
            const newStatus = !activeDriver.isOnline;
            driversRef.child(activeDriver.fbKey).update({ isOnline: newStatus });
            activeDriver.isOnline = newStatus;
            renderPanel();
            if(newStatus) {
                startGpsTracking();
            } else {
                stopGpsTracking();
            }
        }

        function pushLocation(lat, lng) {
            if(!activeDriver || !activeDriver.fbKey) return;
            const detectedCity = getClosestCity(lat, lng);
            driversRef.child(activeDriver.fbKey).update({
                lat: lat,
                lng: lng,
                city: detectedCity,
                lastGpsUpdate: Date.now()
            });
            document.getElementById('dCityDisplay').innerText = detectedCity;
            document.getElementById('driverGpsStatus').innerText = `GPS نشط (${detectedCity})`;
        }

        function forceLocationFetch() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    pushLocation(pos.coords.latitude, pos.coords.longitude);
                }, null, { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 });
            }
        }

        function startGpsTracking() {
            setupMediaSession();

            if(!activeDriver || !activeDriver.isOnline || !("geolocation" in navigator)) {
                stopGpsTracking();
                document.getElementById('driverGpsStatus').innerText = "متوقف (أنت في استراحة)";
                return;
            }

            stopGpsTracking();
            setupMediaSession();
            forceLocationFetch();

            gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
                pushLocation(pos.coords.latitude, pos.coords.longitude);
            }, function(err) {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

            // 3 saniyede bir GPS pingi at
            gpsHeartbeatInterval = setInterval(() => {
                forceLocationFetch();
            }, 3000);
        }

        function stopGpsTracking() {
            const audio = document.getElementById('bgKeepAliveAudio');
            if (audio) { audio.pause(); }
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "paused";
            }
            if(gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
            if(gpsHeartbeatInterval !== null) { clearInterval(gpsHeartbeatInterval); gpsHeartbeatInterval = null; }
        }

        // Ekran kapandığında veya başka uygulamaya geçildiğinde zorla canlı tut
        document.addEventListener('visibilitychange', () => {
            if (activeDriver && activeDriver.isOnline) {
                setupMediaSession();
                forceLocationFetch();
                if (gpsHeartbeatInterval === null) {
                    startGpsTracking();
                }
            }
        });
    </script>
</body>
</html>
