<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاشة السائق | تكسي البلد</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --brand-yellow: #fcba03;
            --brand-black: #111111;
            --brand-card: #222222;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--brand-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .driver-container { width: 100%; max-width: 440px; }
        
        .driver-card {
            background: var(--brand-card);
            border: 2px solid var(--brand-yellow);
            border-radius: 24px;
            padding: 2.2rem 1.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .driver-card::before {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: repeating-linear-gradient(90deg, var(--brand-yellow), var(--brand-yellow) 15px, #000 15px, #000 30px);
        }

        .driver-avatar {
            width: 75px; height: 75px;
            background: rgba(252, 186, 3, 0.15);
            color: var(--brand-yellow);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin: 0.5rem auto 1rem;
            border: 2px solid var(--brand-yellow);
        }

        .gps-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .credit-meter {
            background: #111111;
            border-radius: 14px;
            padding: 1.2rem;
            margin: 1.2rem 0;
            border: 1px solid rgba(252, 186, 3, 0.3);
        }

        .credit-number { font-size: 3rem; font-weight: 900; color: var(--brand-yellow); line-height: 1.1; }
        
        .badge { padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: 800; display: inline-block; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-busy { background: rgba(252, 186, 3, 0.2); color: var(--brand-yellow); border: 1px solid var(--brand-yellow); }

        .toggle-status-btn {
            width: 100%; padding: 15px; border-radius: 12px;
            font-size: 1.1rem; font-weight: 900; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-to-break { background: #ef4444; color: #fff; box-shadow: 0 4px 15px rgba(239,68,68,0.3); }
        .btn-to-work { background: #22c55e; color: #000; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }

        .driver-expired-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px dashed var(--accent-red);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            margin-top: 1rem;
        }
        .driver-expired-box p { color: #ffb4b4; font-size: 0.95rem; font-weight: 700; line-height: 1.5; margin-bottom: 1rem; }
        .btn-renew-sub {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #ffffff; text-decoration: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: 900; font-size: 1rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .form-input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #444; background: #fff; color: #000;
            outline: none; margin-bottom: 12px; font-size: 1rem; font-weight: 700;
        }
        .btn-submit {
            width: 100%; background: var(--brand-yellow); color: #000;
            border: none; padding: 14px; border-radius: 8px;
            font-size: 1.1rem; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="driver-container">
        <!-- 1. GİRİŞ EKRANI -->
        <div id="driverLoginBox" class="driver-card">
            <div class="driver-avatar"><i class="fa-solid fa-id-card"></i></div>
            <h2 style="color:var(--brand-yellow); margin-bottom:4px;">تطبيق السائق</h2>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem;">تكسي البلد | تسجيل الدخول</p>
            
            <form onsubmit="handleDriverLogin(event)">
                <input type="text" id="driverPhoneInput" class="form-input" placeholder="رقم الهاتف المسجل (9639...)" required>
                <input type="password" id="driverPassInput" class="form-input" placeholder="كلمة المرور (PIN)" required>
                <button type="submit" class="btn-submit">تسجيل الدخول</button>
            </form>
        </div>

        <!-- 2. ŞOFÖR AKTİF PANELİ -->
        <div id="driverPanelBox" class="driver-card" style="display:none;">
            <div class="driver-avatar"><i class="fa-solid fa-user-tie"></i></div>
            <h2 id="dName" style="font-size: 1.4rem; margin-bottom: 2px;">-</h2>
            <p id="dCar" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px;">-</p>

            <div class="gps-badge" id="driverGpsBadge">
                <i class="fa-solid fa-location-crosshairs"></i> <span id="driverGpsStatus">جاري فحص GPS...</span>
            </div>

            <div class="credit-meter">
                <div style="font-size: 0.85rem; color: var(--text-muted);">الأيام المتبقية في اشتراكك</div>
                <div class="credit-number" id="dDays">0</div>
                <div id="dExpiryDate" style="color:var(--text-muted); font-size:0.8rem; margin-top:4px;">ينتهي في: --</div>
                <div id="dStatusBadge" class="badge badge-active" style="margin-top: 8px;">-</div>
            </div>

            <button class="toggle-status-btn btn-to-break" id="driverToggleOnlineBtn" onclick="toggleOnline()">
                <i class="fa-solid fa-pause"></i> <span>أخذ استراحة (إيقاف الاستقبال)</span>
            </button>

            <!-- Gün Bittiğinde Görünecek Alan -->
            <div id="driverExpiredBox" class="driver-expired-box" style="display:none;">
                <p>
                    <i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red);"></i>
                    انتهى اشتراكك في النظام!<br>يرجى التواصل مع إدارة تكسي البلد لتجديد وإضافة أيام جديدة.
                </p>
                <a id="driverRenewWhatsAppBtn" href="#" class="btn-renew-sub">
                    <i class="fa-brands fa-whatsapp"></i> تواصل مع الإدارة عبر واتساب
                </a>
            </div>

            <button onclick="logoutDriver()" style="background:transparent; border:none; color:var(--text-muted); margin-top:18px; cursor:pointer; font-size:0.85rem;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const driversRef = db.ref('drivers');

        const CENTRAL_ADMIN_PHONE = "963962750014";
        let activeDriver = null;
        let driversList = [];
        let gpsWatchId = null;
        let wakeLock = null;

        // Sayfa açıldığında daha önce giriş yapılmış mı kontrol et
        const savedPhone = localStorage.getItem('taxi_driver_phone');

        driversRef.on('value', (snapshot) => {
            const data = snapshot.val();
            driversList = [];
            if(data) {
                Object.keys(data).forEach(key => driversList.push({ ...data[key], fbKey: key }));
            }
            if(activeDriver) {
                const updated = driversList.find(d => d.phone === activeDriver.phone);
                if(updated) { activeDriver = updated; renderPanel(); }
            } else if(savedPhone) {
                const found = driversList.find(d => d.phone === savedPhone);
                if(found) {
                    activeDriver = found;
                    document.getElementById('driverLoginBox').style.display = 'none';
                    document.getElementById('driverPanelBox').style.display = 'block';
                    renderPanel();
                    startGpsTracking();
                }
            }
        });

        function calculateDays(expiryTimestamp) {
            const diff = expiryTimestamp - Date.now();
            return diff <= 0 ? 0 : Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function handleDriverLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('driverPhoneInput').value.replace(/[^0-9]/g, '');
            const pass = document.getElementById('driverPassInput').value.trim();

            const driver = driversList.find(d => d.phone === phone);
            if(!driver) { alert("❌ رقم الهاتف غير مسجل لدى الإدارة!"); return; }
            if(driver.password && driver.password !== pass) { alert("❌ كلمة السر (PIN) غير صحيحة!"); return; }

            activeDriver = driver;
            localStorage.setItem('taxi_driver_phone', phone);
            document.getElementById('driverLoginBox').style.display = 'none';
            document.getElementById('driverPanelBox').style.display = 'block';
            renderPanel();
            startGpsTracking();
        }

        function logoutDriver() {
            localStorage.removeItem('taxi_driver_phone');
            activeDriver = null;
            if(gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
            document.getElementById('driverPanelBox').style.display = 'none';
            document.getElementById('driverLoginBox').style.display = 'block';
        }

        function renderPanel() {
            if(!activeDriver) return;
            const daysLeft = calculateDays(activeDriver.expiryTimestamp);
            document.getElementById('dName').innerText = activeDriver.name;
            document.getElementById('dCar').innerText = activeDriver.car;
            document.getElementById('dDays').innerText = daysLeft;
            
            const expDate = new Date(activeDriver.expiryTimestamp);
            document.getElementById('dExpiryDate').innerText = `ينتهي في: ${expDate.getDate()}/${expDate.getMonth()+1}/${expDate.getFullYear()}`;

            const badge = document.getElementById('dStatusBadge');
            const toggleBtn = document.getElementById('driverToggleOnlineBtn');
            const expiredBox = document.getElementById('driverExpiredBox');
            const renewBtn = document.getElementById('driverRenewWhatsAppBtn');

            if(daysLeft <= 0) {
                badge.className = "badge badge-expired";
                badge.innerText = "منتهي الاشتراك (موقوف)";
                toggleBtn.style.display = "none";
                expiredBox.style.display = "block";
                
                const renewMsg = `مرحباً إدارة تكسي البلد، أنا السائق (${activeDriver.name}) ورقمي (${activeDriver.phone}). انتهى اشتراكي وأرغب بتجديد وإضافة أيام جديدة.`;
                renewBtn.href = `https://wa.me/${CENTRAL_ADMIN_PHONE}?text=${encodeURIComponent(renewMsg)}`;
            } else {
                expiredBox.style.display = "none";
                toggleBtn.style.display = "flex";
                if(activeDriver.isOnline) {
                    badge.className = "badge badge-active";
                    badge.innerText = "متاح للعمل (أونلاين)";
                    toggleBtn.className = "toggle-status-btn btn-to-break";
                    toggleBtn.innerHTML = '<i class="fa-solid fa-pause"></i> <span>أخذ استراحة (إيقاف الاستقبال)</span>';
                } else {
                    badge.className = "badge badge-busy";
                    badge.innerText = "في استراحة (أوفلاين)";
                    toggleBtn.className = "toggle-status-btn btn-to-work";
                    toggleBtn.innerHTML = '<i class="fa-solid fa-play"></i> <span>بدء العمل (استقبال المشاوير)</span>';
                }
            }
        }

        function toggleOnline() {
            if(!activeDriver || !activeDriver.fbKey) return;
            const newStatus = !activeDriver.isOnline;
            driversRef.child(activeDriver.fbKey).update({ isOnline: newStatus });
            activeDriver.isOnline = newStatus;
            renderPanel();
            startGpsTracking();
        }

        // Ekranın uykuya geçmesini engelle
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function startGpsTracking() {
            requestWakeLock();
            if(!activeDriver || !activeDriver.isOnline || !("geolocation" in navigator)) {
                if(gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
                document.getElementById('driverGpsStatus').innerText = "متوقف (أنت في استراحة)";
                return;
            }
            if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);

            gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
                if(activeDriver && activeDriver.fbKey) {
                    driversRef.child(activeDriver.fbKey).update({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        lastGpsUpdate: Date.now()
                    });
                }
                document.getElementById('driverGpsStatus').innerText = "GPS متصل ومشارك بنجاح";
            }, function() {
                document.getElementById('driverGpsStatus').innerText = "تعذر تحديد موقع GPS";
            }, { enableHighAccuracy: true, timeout: 20000 });
        }
    </script>
</body>
</html>
